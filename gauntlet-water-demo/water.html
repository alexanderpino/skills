<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shallow Coastal Water</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c" width="900" height="600"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, preserveDrawingBuffer:true});
if (!gl) { throw new Error('WebGL2 not available'); }

const vsSrc = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID==2)?3.0:-1.0, (gl_VertexID==1)?3.0:-1.0);
  gl_Position = vec4(p,0.0,1.0);
}`;

const fsSrc = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 u_res;
uniform float u_time;

// ---------- noise ----------
float hash(vec2 p){
  p = fract(p*vec2(123.34, 456.21));
  p += dot(p, p+45.32);
  return fract(p.x*p.y);
}
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float v=0.0, a=0.5;
  for(int i=0;i<3;i++){
    v += a*vnoise(p);
    p = p*2.03 + vec2(17.3,9.1);
    a *= 0.5;
  }
  return v;
}

// ---------- scene constants ----------
const vec3 SUN_DIR = normalize(vec3(0.25, 0.62, -0.74));
const float F0 = 0.02; // water IOR 1.33 -> ((1.33-1)/(1.33+1))^2

vec3 skyColor(vec3 dir){
  vec3 hor = vec3(0.78, 0.86, 0.92);
  vec3 zen = vec3(0.27, 0.53, 0.86);
  vec3 sky = mix(hor, zen, pow(clamp(dir.y,0.0,1.0), 0.5));
  float sunDot = max(dot(dir, SUN_DIR), 0.0);
  sky += vec3(1.0, 0.95, 0.8) * pow(sunDot, 500.0) * 4.0;
  sky += vec3(1.0, 0.9, 0.7) * pow(sunDot, 40.0) * 0.35;
  return sky;
}

// bathymetry: elevation of rock relative to sea level. >0 breaks surface.
float bathy(vec2 xz){
  float shoreShift = 8.0*sin(xz.x*0.04+1.7) + 4.0*sin(xz.x*0.11+0.3);
  float fwd = clamp(5.0 - xz.y + shoreShift, 0.0, 200.0);
  float shallow = smoothstep(0.0, 55.0, fwd);
  float depthGrad = -0.02 - 2.9*shallow;
  float amp = mix(1.3, 0.12, shallow);
  vec2 p = xz*0.20;
  float n1 = fbm(p*1.8);
  float ridge = 1.0 - abs(n1*2.0-1.0);
  float n2 = fbm(p*6.0 + vec2(31.0,7.0));
  float shape = mix(n1, ridge, 0.6)*2.0 - 1.0;
  float detail = (n2*2.0-1.0)*0.4;
  return depthGrad + amp*(shape + detail);
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 uv = (fc - 0.5*u_res) / u_res.y;

  vec3 forward = normalize(vec3(0.0, -0.62, -1.0));
  vec3 right = normalize(cross(forward, vec3(0.0,1.0,0.0)));
  vec3 up = cross(right, forward);
  float fov = 1.2;
  vec3 rd = normalize(forward + uv.x*fov*right + uv.y*fov*up);
  vec3 ro = vec3(0.0, 3.6, 3.0);

  if (rd.y >= -0.001){
    outColor = vec4(skyColor(rd), 1.0);
    return;
  }

  float t0 = -ro.y / rd.y;
  if (t0 < 0.0){
    outColor = vec4(skyColor(rd), 1.0);
    return;
  }

  vec2 xz0 = ro.xz + rd.xz * t0;
  float b0 = bathy(xz0);
  float t1 = (b0 - ro.y) / rd.y;
  t1 = clamp(t1, 0.0, 400.0);
  vec2 xz1 = ro.xz + rd.xz * t1;
  float b1 = bathy(xz1);

  // rock normal via finite differences
  float eps = 0.35;
  float hL = bathy(xz1 - vec2(eps,0.0));
  float hR = bathy(xz1 + vec2(eps,0.0));
  float hD = bathy(xz1 - vec2(0.0,eps));
  float hU = bathy(xz1 + vec2(0.0,eps));
  vec3 rockNormal = normalize(vec3(hL-hR, 2.0*eps, hD-hU));

  // water surface wave normal: sum of sine waves + high-freq jitter
  vec2 wp = xz1;
  float t = u_time;
  float dHdx = 0.0, dHdz = 0.0;
  {
    vec2 d; float freq, speed, amp, ph, dv;
    d=normalize(vec2(1.0,0.15)); freq=0.55; speed=1.1; amp=0.05;
    ph=dot(d,wp)*freq+t*speed; dv=amp*freq*cos(ph); dHdx+=dv*d.x; dHdz+=dv*d.y;
    d=normalize(vec2(-0.4,1.0)); freq=0.9; speed=-0.8; amp=0.035;
    ph=dot(d,wp)*freq+t*speed; dv=amp*freq*cos(ph); dHdx+=dv*d.x; dHdz+=dv*d.y;
    d=normalize(vec2(0.7,-0.6)); freq=2.3; speed=1.7; amp=0.014;
    ph=dot(d,wp)*freq+t*speed; dv=amp*freq*cos(ph); dHdx+=dv*d.x; dHdz+=dv*d.y;
    d=normalize(vec2(0.95,0.31)); freq=6.1; speed=-2.4; amp=0.006;
    ph=dot(d,wp)*freq+t*speed; dv=amp*freq*cos(ph); dHdx+=dv*d.x; dHdz+=dv*d.y;
    d=normalize(vec2(-0.2,0.87)); freq=13.7; speed=3.1; amp=0.0022;
    ph=dot(d,wp)*freq+t*speed; dv=amp*freq*cos(ph); dHdx+=dv*d.x; dHdz+=dv*d.y;
  }
  vec3 waterNormal = normalize(vec3(-dHdx, 1.0, -dHdz));

  // ---- masks ----
  float turb = fbm(xz1*0.9 + vec2(0.0, u_time*0.6));
  float edgeBand = 1.0 - smoothstep(0.0, 0.22, abs(b1+0.03));
  float foamNoise = smoothstep(0.35, 0.75, turb + 0.15*sin(u_time*2.0 + xz1.x*0.5));
  float foamMask = edgeBand * foamNoise;
  foamMask *= smoothstep(0.4, 0.0, b1-0.35);
  foamMask = clamp(foamMask, 0.0, 1.0);

  float plumeNoise = fbm(xz1*0.35 + vec2(u_time*0.15, u_time*0.08));
  float lowRise = smoothstep(-1.6, -0.5, b1);
  float highFall = 1.0 - smoothstep(-0.2, 0.35, b1);
  float plumeMask = clamp(lowRise * highFall * mix(0.5,1.0,plumeNoise), 0.0, 1.0);

  // ---- underwater color: depth-driven extinction ramp ----
  float verticalDepth = max(-b1, 0.0);
  float rayDist = verticalDepth / max(-rd.y, 0.12);
  vec3 sigma = vec3(1.55, 0.34, 0.075); // red absorbed first
  vec3 T = exp(-sigma * rayDist);

  vec3 bottomColor = mix(vec3(0.15,0.13,0.10), vec3(0.30,0.27,0.21), fbm(xz1*0.3)*0.6+0.2);
  vec3 scatterColorDeep = vec3(0.015, 0.08, 0.17);
  vec3 plumeColor = vec3(0.82, 0.93, 0.93);
  vec3 scatterColorLocal = mix(scatterColorDeep, plumeColor, plumeMask);
  vec3 Tlocal = T * (1.0 - plumeMask*0.85); // plume raises scattering, not absorption
  vec3 waterUnderColor = bottomColor*Tlocal + scatterColorLocal*(1.0-Tlocal);

  // ---- rock color ----
  float wetness = 1.0 - smoothstep(0.0, 0.6, b1);
  vec3 dryRock = vec3(0.50,0.45,0.37);
  vec3 wetRock = vec3(0.06,0.065,0.07);
  vec3 rockBase = mix(dryRock, wetRock, wetness);
  rockBase *= 0.9 + 0.2*fbm(xz1*0.6+vec2(5.0,2.0));
  float sunDiff = max(dot(rockNormal, SUN_DIR), 0.0);
  vec3 rockLit = rockBase * (0.4 + 0.9*sunDiff);
  float specPow = mix(10.0, 70.0, wetness);
  float specAmt = mix(0.03, 0.4, wetness);
  vec3 rH = reflect(-SUN_DIR, rockNormal);
  float rockSpec = specAmt * pow(max(dot(rH, -rd), 0.0), specPow);
  vec3 rockColor = rockLit + rockSpec*vec3(1.0,0.97,0.9);

  float edge = smoothstep(-0.12, 0.12, b1);
  vec3 composited = mix(waterUnderColor, rockColor, edge);

  float foamBrightness = mix(0.55, 1.0, foamNoise);
  vec3 foamCol = vec3(0.96,0.98,1.0) * foamBrightness;
  composited = mix(composited, foamCol, foamMask);

  // ---- fresnel + sky reflection (killed by foam and on rock) ----
  vec3 reflectDir = reflect(rd, waterNormal);
  float NdotV = max(dot(waterNormal, -rd), 0.0);
  float fres = F0 + (1.0-F0)*pow(1.0-NdotV, 5.0);
  fres = min(fres, 0.88); // never fully mirrors - water is not chrome
  float effFresnel = fres * (1.0-edge) * (1.0-foamMask);
  vec3 skyRefl = skyColor(reflectDir);
  vec3 col = mix(composited, skyRefl, effFresnel);

  // ---- sun glitter: finite-width path, not a point ----
  float glitDot = max(dot(reflectDir, SUN_DIR), 0.0);
  float sparkle = vnoise(xz1*8.0 + u_time*3.0);
  float glit = pow(glitDot, 140.0) * (0.35 + 1.6*smoothstep(0.5,0.95,sparkle));
  glit += pow(glitDot, 14.0) * 0.06;
  vec3 sunGlint = glit * vec3(1.0,0.96,0.85) * (1.0-edge) * (1.0-foamMask);
  col += sunGlint;

  // ---- distance fog ----
  vec3 fogColor = skyColor(normalize(vec3(rd.x, 0.04, rd.z)));
  float fogT = smoothstep(70.0, 200.0, t0);
  col = mix(col, fogColor, fogT*0.7);

  // mild saturation boost so depth/plume hues survive the sky-reflection mix
  float lum = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(lum), col, 1.25);

  // tonemap
  col = col / (col + vec3(1.0));
  col = pow(col, vec3(1.0/1.9));

  outColor = vec4(col, 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error('shader compile error: ' + gl.getShaderInfoLog(s));
    throw new Error('shader compile failed: ' + gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  console.error('program link error: ' + gl.getProgramInfoLog(prog));
  throw new Error('program link failed: ' + gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

gl.viewport(0,0,canvas.width, canvas.height);
gl.uniform2f(uRes, canvas.width, canvas.height);

function frame(ts){
  gl.uniform1f(uTime, ts*0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
