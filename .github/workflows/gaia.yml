name: gaia

# Gaia's guards are `scripts/check.py` (attribution well-formedness, coverage both ways, the
# per-file line cap) and `scripts/index.py --check` (the generated index has not been hand
# edited). Without something that RUNS them on every push they are a snapshot of one
# afternoon -- the same argument the terrain-architect workflow opens with, and the same
# history: this corpus has already had assertions that were defined and never called.
#
# The `bites` job below is the part that matters. A workflow that only runs a PASSING guard
# cannot tell you the guard still works; check.py once had two assertions that were defined
# and never invoked, and it stayed green throughout. So CI also applies mutations and requires
# the guard to go RED, plus a decoy it must stay GREEN on. That is the repo's standing rule --
# a guard never seen to fail is not known to be a guard -- executed on every push rather than
# recorded in a register once.

on:
  push:
    paths:
      - 'gaia/**'
      - '.github/workflows/gaia.yml'
  pull_request:
    paths:
      - 'gaia/**'
      - '.github/workflows/gaia.yml'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependencies on purpose. Gaia ships no reference implementation and its scripts are
      # stdlib-only; if that ever stops being true, this step failing is the right alarm.
      # Runs BEFORE the guard. A reported metric never fails, so nothing forces it to be
      # right -- and locator_quality was wrong for weeks, scoring "the fill algorithm" as a
      # precise locator because it matched the bare word "algorithm". Enforced assertions get
      # mutation rows in the bites job because failing is what they do; a reported number
      # needs a fixture set instead, or it is decoration.
      - name: Reported metrics must classify their fixtures correctly
        run: python3 gaia/scripts/check.py --selftest

      # The re-quote pass is stdlib-only for its fixtures and needs no artefact cache to run
      # them. Its corpus mode DOES need one, so CI runs the fixtures only -- and that is the
      # honest split: without a cache the tool reports "nothing was checked, and that is not
      # a pass" rather than exiting green on an empty run.
      - name: Re-quote fixtures must classify correctly
        run: python3 gaia/scripts/requote.py --selftest

      - name: Guard must be green
        run: python3 gaia/scripts/check.py

      - name: Generated index must be current
        run: python3 gaia/scripts/index.py --check

      - name: Evals must be valid JSON with the shape the runner expects
        run: |
          python3 - <<'PY'
          import json, sys
          ev = json.load(open('gaia/evals/evals.json'))
          tr = json.load(open('gaia/evals/trigger-evals.json'))
          assert ev['skill_name'] == 'gaia', ev.get('skill_name')
          ids = [e['id'] for e in ev['evals']]
          assert ids == sorted(set(ids)) == list(range(1, len(ids) + 1)), f'bad ids: {ids}'
          for e in ev['evals']:
              for k in ('id', 'axis', 'prompt', 'expected_output', 'expectations'):
                  assert k in e, f"eval {e.get('id')} missing {k}"
              assert e['expectations'], f"eval {e['id']} has no expectations"
          assert all(isinstance(q['should_trigger'], bool) and q['query'] for q in tr), 'bad trigger row'
          pos = sum(q['should_trigger'] for q in tr)
          # Negatives are what make a trigger suite mean anything; a suite of positives only
          # proves the description is broad, which is the failure mode, not the goal.
          assert pos and len(tr) - pos, f'{pos} positive, {len(tr) - pos} negative -- need both'
          print(f"{len(ev['evals'])} evals, {len(tr)} trigger queries "
                f"({pos} positive, {len(tr) - pos} negative)")
          PY

  bites:
    # Proves the guard still fails on things it is supposed to fail on. Runs against a COPY so
    # a mutation can never be left behind in the tree, and mutates only SUBJECTS (documents,
    # the coverage map, the index) -- never the guard itself, which would prove nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mutations must turn the guard red, and the decoy must not
        run: |
          set -u
          cp -r gaia /tmp/g && cd /tmp/g
          fails=0

          expect_red() {   # $1 = label
            if python3 scripts/check.py >/tmp/out 2>&1; then
              echo "::error::guard stayed GREEN on mutation '$1' -- it does not bite"
              fails=$((fails + 1))
            else
              echo "  red as required: $1  -- $(grep -m1 FAIL /tmp/out | cut -c1-100)"
            fi
          }

          SUBJ=references/caustics.md

          # Written in Python, not sed, and it ASSERTS the mutation applied. A sed range that
          # silently matches nothing turns this whole job into a vacuous pass -- which is
          # exactly what happened to the first draft of this step, caught only by running it.
          cat > /tmp/mut1.py <<'PY'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1]); s = p.read_text(encoding="utf-8")
          ids = re.findall(r"\{\s*id:\s*([A-Za-z0-9_]+)", s)
          assert ids, "no source ids in " + str(p) + " -- mutation would pass vacuously"
          for i in ids:
              if f"[{i}]" in s:
                  p.write_text(s.replace(f"[{i}]", f"[{i}_broken]"), encoding="utf-8")
                  print("broke", i); break
          else:
              raise SystemExit("no declared id appears as a body marker")
          PY

          cp $SUBJ /tmp/bk
          python3 /tmp/mut1.py $SUBJ
          expect_red "citation key points at nothing"
          cp /tmp/bk $SUBJ

          cp $SUBJ /tmp/bk
          sed -i '0,/locator: "/s/locator: "[^"]*"/locator: ""/' $SUBJ
          expect_red "locator emptied"
          cp /tmp/bk $SUBJ

          cp $SUBJ /tmp/bk
          python3 -c "p='$SUBJ';open(p,'a').write('\nfiller\n'*400)"
          expect_red "line cap exceeded"
          cp /tmp/bk $SUBJ

          cp $SUBJ /tmp/bk
          sed -i 's/^status: draft/status: finished/' $SUBJ
          expect_red "illegal status value"
          cp /tmp/bk $SUBJ

          cp $SUBJ /tmp/bk
          sed -i 's/^status: draft/status: draft\nokf_version: "0.2"/' $SUBJ
          expect_red "okf_version outside the bundle root"
          cp /tmp/bk $SUBJ

          cp references/coverage.md /tmp/bk
          sed -i 's/→ caustics.md/→ caustics-nonexistent.md/' references/coverage.md
          expect_red "coverage points at a document that does not exist"
          cp /tmp/bk references/coverage.md

          cp references/tiled-streaming.md /tmp/bk
          sed -i 's/^## Use this/## Some notes/' references/tiled-streaming.md
          expect_red "document surveys instead of recommending"
          cp /tmp/bk references/tiled-streaming.md

          # The `no artefact:` marker excludes a citation from the locator ratio. Pasting it
          # onto a real paper makes a gap disappear and the percentage RISE -- 53% to 54% when
          # this was written. That is the one mutation here that improves a reported number,
          # which is exactly why it needs a guard.
          cp references/stream-power.md /tmp/bk
          sed -i '0,/id: braun2013/s/locator: "/locator: "no artefact: /' references/stream-power.md
          expect_red "a real paper marked as having no artefact"
          cp /tmp/bk references/stream-power.md

          # The same attack dressed to beat the PREVIOUS implementation, which regex-matched the
          # bibliography entry's prose and read only its first line. A reviewer showed that moving
          # four words onto line 1 of a source with a real artefact passed green.
          cp references/papers-architecture.md /tmp/bk
          cp references/node-graph-runtime.md /tmp/bk2
          sed -i 's/- \*\*nuke_request\*\* `F` — Foundry\./- **nuke_request** `F` — No canonical paper. Foundry./' references/papers-architecture.md
          sed -i 's/{ id: nuke_request, tier: F, locator: "the DD/{ id: nuke_request, tier: F, locator: "no artefact: the DD/' references/node-graph-runtime.md
          expect_red "the prose-regex bypass of the no-artefact exclusion"
          cp /tmp/bk references/papers-architecture.md
          cp /tmp/bk2 references/node-graph-runtime.md

          # And the other direction: an entry tagged [no-artefact] cited with a real locator.
          cp references/wave-models.md /tmp/bk
          sed -i '0,/id: airy_coastal/s/locator: "no artefact: /locator: "\u00a74 the dispersion relation, /' references/wave-models.md
          expect_red "a [no-artefact] entry given an openable locator"
          cp /tmp/bk references/wave-models.md

          cp references/index.md /tmp/bk
          sed -i 's/^# Gaia index/# Gaia index EDITED/' references/index.md
          if python3 scripts/index.py --check >/dev/null 2>&1; then
            echo "::error::index --check stayed GREEN on a hand edit"
            fails=$((fails + 1))
          else
            echo "  red as required: generated index hand-edited"
          fi
          cp /tmp/bk references/index.md

          # The decoys. A guard that fires on rewording gets ignored within a week, and this
          # corpus is reworded constantly -- so staying green here is a requirement, not a nicety.
          expect_green() {   # $1 = label
            if python3 scripts/check.py >/dev/null 2>&1; then
              echo "  green as required: $1"
            else
              echo "::error::guard fired on '$1' -- it is too eager to be trusted"
              fails=$((fails + 1))
            fi
          }

          cp $SUBJ /tmp/bk
          sed -i 's/\bthe bed\b/the pool floor/g' $SUBJ
          expect_green "prose reworded, no citation touched"
          cp /tmp/bk $SUBJ

          cp references/tiled-streaming.md /tmp/bk
          sed -i 's/^## How this fails.*/## Failure modes/' references/tiled-streaming.md
          expect_green "a heading that is not the recommendation renamed"

          # The two metrics added after a grounding pass disagreed with an honest writer:
          # a locator naming source-code line ranges scored vague because the pattern knew
          # only the designators a PAPER uses, and 21 unopened sources had nowhere in the
          # tier vocabulary to live. Both are now fixtures, so crippling either is caught.
          cp scripts/check.py /tmp/bk_guard
          python3 - <<'PY2'
          import pathlib
          p = pathlib.Path("scripts/check.py"); s = p.read_text(encoding="utf-8")
          old = r"| \blines?\s+\d"
          assert old in s, "locator source-line alternative missing -- mutation would pass vacuously"
          p.write_text(s.replace(old, r"| \bNEVERMATCHES?\s+\d"), encoding="utf-8")
          PY2
          if python3 scripts/check.py --selftest >/tmp/out 2>&1; then
            echo "::error::--selftest stayed GREEN with the locator pattern crippled"
            fails=$((fails + 1))
          else
            echo "  red as required: selftest catches a crippled locator pattern"
          fi
          cp /tmp/bk_guard scripts/check.py

          python3 - <<'PY3'
          import pathlib
          p = pathlib.Path("scripts/check.py"); s = p.read_text(encoding="utf-8")
          old = 'LOCATOR_NOT_OPENED = ("NOT OPENED", "NO LOCATOR")'
          assert old in s, "not-opened marker missing -- mutation would pass vacuously"
          p.write_text(s.replace(old, 'LOCATOR_NOT_OPENED = ("ZZ_NEVER",)'), encoding="utf-8")
          PY3
          if python3 scripts/check.py --selftest >/tmp/out 2>&1; then
            echo "::error::--selftest stayed GREEN with the not-opened marker disabled"
            fails=$((fails + 1))
          else
            echo "  red as required: selftest catches a disabled not-opened marker"
          fi
          cp /tmp/bk_guard scripts/check.py
          cp /tmp/bk references/tiled-streaming.md

          # Three guards were added in a single day and NOTHING asserted they run. Gutting them
          # to `return []` left check.py and --selftest both green -- because on a clean corpus a
          # check that finds nothing is indistinguishable from a check that does nothing. So the
          # mutation has to be a VIOLATION each guard uniquely catches.

          # check_not_opened: an entry whose citing locator declares NOT OPENED, untagged.
          cp references/papers-generation.md /tmp/bk_no
          python3 - <<'PYNO'
          import re, pathlib
          p = pathlib.Path("references/papers-generation.md"); s = p.read_text(encoding="utf-8")
          assert "`P` [not-opened]" in s, "no tagged entry -- mutation would pass vacuously"
          p.write_text(s.replace("`P` [not-opened]", "`P`", 1), encoding="utf-8")
          PYNO
          expect_red "a not-opened tag removed while the locator still declares it"
          cp /tmp/bk_no references/papers-generation.md

          # check_headings: a duplicated heading at the same level.
          cp $SUBJ /tmp/bk
          python3 - <<'PYHD'
          import pathlib
          p = pathlib.Path("references/caustics.md"); s = p.read_text(encoding="utf-8")
          h = "## Use this"
          assert h in s, "no `## Use this` -- mutation would pass vacuously"
          p.write_text(s.replace(h, h + "\n\ndup\n\n" + h, 1), encoding="utf-8")
          PYHD
          expect_red "a heading duplicated at the same level"
          cp /tmp/bk $SUBJ

          # check_axis_agreement: a document tagged onto an axis coverage.md does not file it under.
          cp references/sea-ice.md /tmp/bk_ax
          python3 - <<'PYAX'
          import re, pathlib
          p = pathlib.Path("references/sea-ice.md"); s = p.read_text(encoding="utf-8")
          assert re.search(r"^tags: \[simulation", s, re.M), "axis tag moved -- update this mutation"
          p.write_text(re.sub(r"^tags: \[simulation", "tags: [generation", s, count=1, flags=re.M),
                       encoding="utf-8")
          PYAX
          # Regenerate the index first. Without this the mutation is red because the index went
          # stale, NOT because the axes disagree -- so it would stay red with check_axis_agreement
          # deleted, and prove nothing about the guard it names. Caught by running this job.
          python3 scripts/index.py >/dev/null
          expect_red "axis tag disagreeing with the coverage section"
          cp /tmp/bk_ax references/sea-ice.md
          python3 scripts/index.py >/dev/null

          # A trigger suite is graded by size and never by reach. Before `routes_to` existed,
          # 17 of 34 written documents had no positive query and nothing could say so, because
          # `should_trigger` records whether the SKILL fires, never which document answers.
          # Deleting one query is the violation this guard uniquely catches: every other check
          # in this file stays green on it.
          cp evals/trigger-evals.json /tmp/bk_tr
          cat > /tmp/mut_tr.py <<'PYTR'
          import json, pathlib
          p = pathlib.Path("evals/trigger-evals.json")
          rows = json.loads(p.read_text(encoding="utf-8"))
          keep = [r for r in rows if r.get("routes_to") != ["sea-ice.md"]]
          assert len(keep) < len(rows), "no query routes to sea-ice.md -- mutation would pass vacuously"
          p.write_text(json.dumps(keep, indent=2), encoding="utf-8")
          PYTR
          python3 /tmp/mut_tr.py
          expect_red "a covered document no trigger query reaches"
          cp /tmp/bk_tr evals/trigger-evals.json

          # The propagation guard: both ends of a citation must name overlapping sections. This
          # mutation moves ONE end, which is exactly the defect -- a locator sharpened in a
          # document while its bibliography entry keeps the old section. No other check in this
          # file sees it: the id still resolves, the locator is still non-empty and still sharp.
          # It must target a citation the guard can SEE -- one whose bibliography entry also names
          # a section. The first version of this mutation moved a locator whose entry named none,
          # so the pair fell into the 94% that cannot be cross-checked and the job passed
          # vacuously. Caught by running it.
          cp references/mask-operators.md /tmp/bk_pr
          cat > /tmp/mut_pr.py <<'PYPR'
          import pathlib
          p = pathlib.Path("references/mask-operators.md")
          s = p.read_text(encoding="utf-8")
          assert "§1 Introduction and overview" in s, "fiorio1996 locator not as expected"
          p.write_text(s.replace("§1 Introduction and overview",
                                 "§9 Introduction and overview", 1), encoding="utf-8")
          print("moved fiorio1996 from section 1 to section 9 at the document end only")
          PYPR
          python3 /tmp/mut_pr.py
          expect_red "a locator moved at one end of a citation only"
          cp /tmp/bk_pr references/mask-operators.md

          python3 scripts/check.py >/dev/null || { echo "::error::copy not restored"; fails=$((fails+1)); }
          echo
          [ "$fails" -eq 0 ] && echo "all mutations bite; decoy clean" || { echo "$fails problem(s)"; exit 1; }
